<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pencari Nomor Probis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom sempit, kotak cari di atas, hasil berupa daftar nomor probis dengan nomor sebagai elemen utama. */
:root{
  --bg:#edf2f2; --surface:#ffffff; --ink:#10242b; --muted:#53676e; --line:#d2dcdd;
  --accent:#0b6e69; --accent-ink:#ffffff; --soft:#dfeeed; --hl:#ffe08a; --hl-ink:#3a2b00;
  --good:#17784a; --warn:#8f6200; --code-bg:#e6f0ef;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c191d; --surface:#13252a; --ink:#e3eef0; --muted:#92a8ad; --line:#26393e;
  --accent:#4fc3bb; --accent-ink:#052321; --soft:#173a3a; --hl:#5c4b10; --hl-ink:#ffeeb3;
  --good:#62d29a; --warn:#e2b84f; --code-bg:#193136; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c191d; --surface:#13252a; --ink:#e3eef0; --muted:#92a8ad; --line:#26393e;
  --accent:#4fc3bb; --accent-ink:#052321; --soft:#173a3a; --hl:#5c4b10; --hl-ink:#ffeeb3;
  --good:#62d29a; --warn:#e2b84f; --code-bg:#193136; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
header h1,.loginbox h1{font-size:1.65rem;line-height:1.15;margin:0 0 6px;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
label.cap{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;resize:vertical;min-height:48px;line-height:1.4}
textarea:focus-visible,select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;min-width:0}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%;min-width:0}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.examples span{font-size:.8rem;color:var(--muted)}
.chip{font:inherit;font-size:.82rem;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:999px;padding:4px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.status{color:var(--muted);font-size:.88rem}
.results{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.card.top{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.code{font-family:var(--mono);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;background:var(--code-bg);border-radius:6px;padding:1px 8px;display:inline-block;overflow-wrap:anywhere}
.ttl{font-weight:500;margin-top:4px}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.76rem}
.tag{border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.good{color:var(--good);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.path{grid-column:1/-1;margin:2px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 4px;font-size:.78rem;color:var(--muted)}
.path li+li::before{content:"›";margin-right:4px}
.path b{font-family:var(--mono);font-weight:500}
.btn{font:inherit;font-size:.84rem;font-weight:500;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.ghost{color:var(--accent);background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-weight:600;white-space:nowrap}
.alts{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;font-size:.76rem;color:var(--muted);align-items:center}
.alt{font:inherit;font-family:var(--mono);font-size:.76rem;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:0 6px;cursor:pointer}
.tree{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.node{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line);min-width:0}
.node:last-child{border-bottom:0}
.node.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--hl)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.node.flash{animation:none;background:var(--hl)}}
.tog{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit;line-height:1;padding:0}
.tog.sp{visibility:hidden}
.node .nc{font-family:var(--mono);font-weight:600;font-size:.86rem;flex:none;padding-top:2px}
.node .nt{min-width:0;flex:1;overflow-wrap:anywhere}
.node.ik .nt::after{content:" • bisa diberi IK";font-size:.72rem;color:var(--good)}
.mini{flex:none;font:inherit;font-size:.74rem;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:1px 8px;cursor:pointer}
.login{max-width:380px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.logobox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.logobox img{display:block;width:100%;height:auto;max-width:100%}
.credit{margin:0;text-align:center;color:var(--muted);font-size:.82rem;letter-spacing:.02em}
.loginbox{gap:8px}
.loginbox h1{font-size:1.4rem;margin:0}
.loginbox .status{margin:0 0 6px}
input[type=text],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.err{min-height:1.3em;color:#b3261e;font-size:.88rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
footer{font-size:.8rem;color:var(--muted);max-width:70ch}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:520px){.card{grid-template-columns:minmax(0,1fr)}.side{flex-direction:row}.code{font-size:1.1rem}}
</style>
</head>

(function(){const st=[];docs.forEach(d=>{while(st.length&&docs[st[st.length-1]].depth>=d.depth)st.pop();
  d.parent=st.length?st[st.length-1]:-1;d.root=d.parent<0?d.i:docs[d.parent].root;d.kids=[];
  if(d.parent>=0)docs[d.parent].kids.push(d.i);st.push(d.i)})})();
const roots=docs.filter(d=>d.parent<0);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- teks: normalisasi, stem sederhana, sinonim ---------- */
const STOP=new Set('dan di ke dari untuk yang pada dengan atas atau secara dalam oleh serta the of and for to in on a an by at'.split(' '));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const PRE=['meng','meny','men','mem','me','peng','peny','pen','pem','pe','ber','ter','per','di','ke','se'];
function stem(w){
  if(w.length<5||/\d/.test(w))return w;
  let x=w.replace(/(kan|nya|lah|kah|an)$/,m=>(w.length-m.length>=4?'':m));
  if(x.length>4&&/i$/.test(x)&&x.length-1>=5)x=x.slice(0,-1);
  for(const p of PRE){if(x.startsWith(p)&&x.length-p.length>=4){x=x.slice(p.length);break}}
  return x;
}
const GROUPS=[
 ['pemeliharaan','maintenance','maintainance','perawatan'],['perencanaan','planning','plan','rencana'],['pengadaan','procurement'],
 ['laporan','report','reporting','pelaporan'],['pemantauan','monitoring','monitor'],['pelatihan','training'],
 ['keselamatan','safety','k3'],['risiko','risk'],['anggaran','budget'],['tagihan','invoice'],['kontrak','contract'],
 ['pembayaran','payment'],['pengujian','uji','test','testing'],['inspeksi','inspection','pemeriksaan'],['kalibrasi','calibration'],
 ['evaluasi','evaluation','review'],['penilaian','asesmen','assessment','assesment'],['perbaikan','corrective','repair'],
 ['pencegahan','preventive'],['darurat','emergency'],['keuangan','finance','financial'],['pajak','tax'],
 ['persediaan','inventory','stok','stock'],['gudang','warehouse'],['turbin','turbine'],['pelanggan','customer'],
 ['karyawan','pegawai','employee'],['cuti','leave'],['gaji','payroll','penggajian'],['aset','asset'],
 ['lingkungan','environment'],['dokumen','document'],['kebijakan','policy'],['prosedur','procedure'],
 ['pelaksanaan','implementation','execution','eksekusi'],['pembongkaran','disassembly'],['pemasangan','assembly'],
 ['pengaturan','setting','penyetelan','adjustment'],['kinerja','performance'],['pengelolaan','management','manajemen'],
 ['pembangkit','plant'],['peralatan','equipment','tools'],['bahan','material'],['pengamanan','security','keamanan'],
 ['pelaksanaan','pelaksana'],['audit','pemeriksaan audit'],['kepatuhan','compliance'],['investasi','investment']
];
const SYN=new Map();
GROUPS.forEach(g=>{const st=g.map(w=>stem(norm(w)));g.forEach(w=>{const k=stem(norm(w));
  if(!SYN.has(k))SYN.set(k,new Set());st.forEach(s=>{if(s!==k&&!s.includes(' '))SYN.get(k).add(s)})})});
const toks=s=>norm(s).split(' ').filter(w=>w&&!STOP.has(w));

const DF=new Map();
docs.forEach(d=>{d.tt=toks(d.title).map(stem);d.ts=new Set(d.tt);d.ts.forEach(t=>DF.set(t,(DF.get(t)||0)+1))});
docs.forEach(d=>{d.anc=new Set();let p=d.parent;while(p>=0){docs[p].ts.forEach(t=>d.anc.add(t));p=docs[p].parent}});
const idf=t=>Math.log(1+N/((DF.get(t)||0)+0.5));
function ed1(a,b){if(Math.abs(a.length-b.length)>1)return false;
  if(a.length===b.length){let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]&&++n>1)return false;return n===1}
  if(a.length>b.length)[a,b]=[b,a];for(let i=0;i<b.length;i++)if(b.slice(0,i)+b.slice(i+1)===a)return true;return false}
function sim(c,t){ if(c===t)return 1;
  if(c.length>=4&&t.length>=4&&(c.startsWith(t)||t.startsWith(c))&&Math.min(c.length,t.length)/Math.max(c.length,t.length)>=.7)return .7;
  if(c.length>=5&&t.length>=5&&ed1(c,t))return .6; return 0}

function parseQuery(q){
  return toks(q).map(w=>{const s=stem(w);return{w,s,alts:[...(SYN.get(s)||[])],id:idf(s)}});
}
function scoreDoc(d,qt,qs){
  let got=0,tot=0;
  for(const q of qt){tot+=q.id;let best=0;
    for(const t of d.tt){const v=sim(q.s,t);if(v>best)best=v}
    for(const a of q.alts){for(const t of d.tt){const v=sim(a,t)*.85;if(v>best)best=v}}
    if(best<1&&d.anc.has(q.s))best=Math.max(best,.3);
    got+=q.id*best}
  if(!tot)return 0;
  let sc=got/tot;
  for(let i=0;i<qt.length-1;i++){const a=qt[i].s,b=qt[i+1].s;
    for(let j=0;j<d.tt.length-1;j++)if(d.tt[j]===a&&d.tt[j+1]===b){sc+=.08;break}}
  if(d.ik)sc+=.03; sc-=.012*Math.max(0,d.tt.length-5);
  return sc;
}
function search(q,opt,limit){
  const t=q.trim(); if(!t)return[];
  if(/^\d+(\.[0-9a-z]+)*$/i.test(t)){
    const c=t.toLowerCase();return docs.filter(d=>d.code.toLowerCase().startsWith(c)&&inScope(d,opt)).slice(0,limit).map(d=>({d,sc:1,cov:1}))}
  const qt=parseQuery(t); if(!qt.length)return[];
  const out=[];
  for(const d of docs){if(!inScope(d,opt))continue;const sc=scoreDoc(d,qt);if(sc>=.28)out.push({d,sc,cov:Math.min(1,sc)})}
  out.sort((a,b)=>b.sc-a.sc||a.d.depth-b.d.depth);
  return out.slice(0,limit).map(o=>({...o,qt}));
}
const inScope=(d,o)=>(o.root<0||d.root===o.root)&&(!o.ik||d.ik);
function label(c){return c>=.8?['Sangat cocok','good']:c>=.55?['Cocok','good']:['Mungkin','warn']}
function hl(title,qt){
  if(!qt)return esc(title);
  const set=[];qt.forEach(q=>{set.push(q.s);q.alts.forEach(a=>set.push(a))});
  return title.split(/([A-Za-z0-9]+)/).map((p,i)=>{if(i%2===0)return esc(p);
    const s=stem(norm(p));return s&&set.some(c=>sim(c,s)>=.7)?'<mark>'+esc(p)+'</mark>':esc(p)}).join('');
}

/* ---------- UI ---------- */
const state={root:-1,ik:true,tab:'cari'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg||('Disalin: '+text))}
  catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?(msg||('Disalin: '+text)):'Salin manual: '+text)}
}
function pathHtml(d){const a=[];let p=d.parent;while(p>=0){a.unshift(docs[p]);p=docs[p].parent}
  return a.length?'<ol class="path">'+a.map(x=>'<li><b>'+esc(x.code)+'</b> '+esc(x.title)+'</li>').join('')+'</ol>':''}
function card(o,i){
  const d=o.d,[lb,cls]=label(o.cov);
  return '<li class="card'+(i===0?' top':'')+'"><div style="min-width:0"><span class="code">'+esc(d.code)+'</span>'+
    '<div class="ttl">'+hl(d.title,o.qt)+'</div>'+
    '<div class="meta" style="margin-top:6px"><span class="tag '+cls+'">'+lb+'</span>'+(d.ik?'<span class="tag">Bisa diberi IK</span>':'<span class="tag">Induk, tidak langsung diberi IK</span>')+'</div></div>'+
    '<div class="side"><button class="btn" data-copy="'+esc(d.code)+'">Salin nomor</button>'+
    '<button class="btn ghost" data-tree="'+d.i+'">Lihat di daftar</button></div>'+pathHtml(d)+'</li>';
}
function run(){
  const raw=$('q').value, lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const opt={root:state.root,ik:state.ik};
  $('results').innerHTML='';$('batch').hidden=true;$('batch').innerHTML='';
  if(!lines.length){$('status').textContent='Ketik judul IK di atas untuk mulai.';return}
  if(lines.length===1){
    const res=search(lines[0],opt,8);
    if(!res.length){$('status').innerHTML='Tidak ada proses yang cukup cocok. Coba kata kunci yang lebih umum, longgarkan filter di atas, atau buka <b>Telusuri semua proses</b>.';return}
    $('status').textContent=res.length+' kandidat, diurutkan dari yang paling sesuai.';
    $('results').innerHTML=res.map(card).join('');
  }else{ batch(lines,opt) }
}
let B=[];
function batch(lines,opt){
  B=lines.map(l=>({l,c:search(l,opt,4),k:0}));
  $('status').textContent=lines.length+' judul IK. Klik nomor alternatif untuk mengganti pilihan.';
  renderBatch();
}
function renderBatch(){
  const rows=B.map((b,r)=>{const o=b.c[b.k];
    if(!o)return '<tr><td>'+esc(b.l)+'</td><td colspan="3" style="color:var(--muted)">Tidak ada yang cocok</td></tr>';
    const [lb,cls]=label(o.cov);
    const alts=b.c.map((x,k)=>k===b.k?'':'<button class="alt" data-r="'+r+'" data-k="'+k+'" title="'+esc(x.d.title)+'">'+esc(x.d.code)+'</button>').join('');
    return '<tr><td>'+esc(b.l)+'</td><td class="num">'+esc(o.d.code)+'</td><td>'+hl(o.d.title,o.qt)+(alts.trim()?'<div class="alts">Alternatif: '+alts+'</div>':'')+'</td><td><span class="tag '+cls+'">'+lb+'</span></td></tr>'}).join('');
  $('batch').hidden=false;
  $('batch').innerHTML='<div class="row" style="margin-bottom:10px"><button class="btn" id="copyAll">Salin tabel untuk Excel</button></div>'+
   '<div class="tablewrap"><table><thead><tr><th>Judul IK</th><th>Nomor probis</th><th>Proses bisnis</th><th>Kecocokan</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
$('batch').addEventListener('click',e=>{
  const a=e.target.closest('.alt');if(a){B[+a.dataset.r].k=+a.dataset.k;renderBatch();return}
  if(e.target.id==='copyAll'){copy(B.map(b=>{const o=b.c[b.k];return b.l+'\t'+(o?o.d.code:'')+'\t'+(o?o.d.title:'')}).join('\n'),'Tabel disalin, tempel di Excel')}
});
$('results').addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');if(c){copy(c.dataset.copy);return}
  const t=e.target.closest('[data-tree]');if(t)reveal(+t.dataset.tree)});

/* ---------- pohon ---------- */
const open=new Set();
function renderTree(flash){
  const out=[];let hide=Infinity,n=0;
  for(const d of docs){
    if(state.root>=0&&d.root!==state.root)continue;
    if(d.depth>hide)continue;hide=Infinity;
    const has=d.kids.length>0,ex=open.has(d.i);
    out.push('<div class="node'+(d.ik?' ik':'')+(flash===d.i?' flash':'')+'" id="n'+d.i+'" style="padding-left:'+(10+d.depth*18)+'px">'+
      (has?'<button class="tog" data-t="'+d.i+'" aria-expanded="'+ex+'" aria-label="'+(ex?'Tutup':'Buka')+' cabang">'+(ex?'−':'+')+'</button>':'<span class="tog sp"></span>')+
      '<span class="nc">'+esc(d.code)+'</span><span class="nt">'+esc(d.title)+'</span>'+
      '<button class="mini" data-c="'+esc(d.code)+'">Salin</button></div>');
    n++;if(has&&!ex)hide=d.depth;
  }
  $('tree').innerHTML=out.join('');$('treecount').textContent=n+' baris tampil';
}
$('tree').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){const i=+t.dataset.t;open.has(i)?open.delete(i):open.add(i);renderTree();
    const b=document.querySelector('[data-t="'+i+'"]');if(b)b.focus();return}
  const c=e.target.closest('[data-c]');if(c)copy(c.dataset.c)});
$('expAll').onclick=()=>{docs.forEach(d=>{if(d.kids.length&&(state.root<0?d.root===(roots[0]&&-2):d.root===state.root))open.add(d.i)});
  if(state.root<0)toast('Pilih satu cabang dulu agar daftar tidak terlalu panjang');renderTree()};
$('colAll').onclick=()=>{open.clear();renderTree()};
function reveal(i){
  state.root=-1;$('root').value='-1';let p=docs[i].parent;while(p>=0){open.add(p);p=docs[p].parent}
  setTab('tree');renderTree(i);const el=$('n'+i);if(el)el.scrollIntoView({block:'center'})}
function setTab(t){
  state.tab=t;const c=t==='cari';
  $('t-cari').setAttribute('aria-selected',c);$('t-tree').setAttribute('aria-selected',!c);
  $('v-cari').hidden=!c;$('v-tree').hidden=c;if(!c)renderTree()}
$('t-cari').onclick=()=>setTab('cari');$('t-tree').onclick=()=>setTab('tree');

$('root').onchange=e=>{state.root=+e.target.value;run();if(state.tab==='tree')renderTree()};

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(user,pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById('loginform').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('lbtn'),err=document.getElementById('lerr');
  err.textContent='';btn.disabled=true;btn.textContent='Memeriksa…';
  try{
    const data=await unlock(document.getElementById('lu').value,document.getElementById('lp').value);
    document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
    document.getElementById('lp').value='';start(data);
  }catch(x){
    err.textContent=(window.crypto&&crypto.subtle)?'Username atau password salah.':'Browser ini tidak mendukung login. Buka lewat https atau browser terbaru.';
    btn.disabled=false;btn.textContent='Masuk';
  }
});
document.getElementById('logout').addEventListener('click',()=>location.reload());
document.getElementById('lu').focus();
</script>
